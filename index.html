<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>學習遊戲室</title>
<style>
:root{--ink:#2B2140;--ink2:#5E5378;--sun:#FFC93C;--octo:#FF7EB3;--ghost:#B49CFF;--leaf:#45D08A;--sky:#5BC8FF;
  --font:"PingFang HK","PingFang TC","Noto Sans HK","Noto Sans CJK HK","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);min-height:100vh;
  background:linear-gradient(180deg,#8FDBFF 0,#CDEFFF 380px,#EEFAFF 900px,#F4FFF7 100%)}
main{max-width:980px;margin:0 auto;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;margin-bottom:24px}
.hero h1{margin:0 0 6px;font-size:clamp(28px,5vw,40px);font-weight:900}
.hero p{margin:0;font-size:17px;color:var(--ink2)}
.cat{display:block;width:100%;height:auto}
.cat .e-y,.cat .e-h,.cat .m-y,.cat .m-h{display:none}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.game{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:14px 16px}
.game:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.game:focus-visible{outline:3px solid #2E7DFF;outline-offset:3px}
.game .ic{width:72px;height:72px;border-radius:18px;border:3px solid var(--ink);background:var(--c);display:grid;place-items:center;font-size:38px}
.game b{display:block;font-size:20px;font-weight:900}
.game span{font-size:14px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags i{font-style:normal;font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:#FFF6D6}
.soon{display:grid;place-items:center;border:3px dashed var(--ink2);border-radius:22px;padding:18px;text-align:center;color:var(--ink2);font-weight:800;background:rgba(255,255,255,.6)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero>div:first-child{width:130px}}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}
</style>
</head>
